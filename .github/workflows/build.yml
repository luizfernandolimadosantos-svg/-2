name: Build Sync PC Checker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download Dear ImGui with retries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'v1.91.9b'
          $urls = @(
            "https://github.com/ocornut/imgui/archive/refs/tags/$version.zip",
            "https://codeload.github.com/ocornut/imgui/zip/refs/tags/$version"
          )
          $archive = Join-Path $env:RUNNER_TEMP 'imgui.zip'
          $unpack = Join-Path $env:RUNNER_TEMP 'imgui-unpacked'

          if (Test-Path 'imgui') {
            throw "A pasta 'imgui' ja existe. Remova-a do repositorio ou adapte o workflow."
          }

          $downloaded = $false
          foreach ($url in $urls) {
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              try {
                Write-Host "Downloading Dear ImGui $version (attempt $attempt/4): $url"
                if (Test-Path $archive) { Remove-Item $archive -Force }
                Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 120 -MaximumRedirection 5
                if ((Get-Item $archive).Length -lt 100000) {
                  throw "Downloaded archive is unexpectedly small."
                }
                $downloaded = $true
                break
              }
              catch {
                Write-Warning "Download failed: $($_.Exception.Message)"
                if ($attempt -lt 4) { Start-Sleep -Seconds (5 * $attempt) }
              }
            }
            if ($downloaded) { break }
          }

          if (-not $downloaded) {
            throw "Unable to download Dear ImGui $version from both GitHub endpoints."
          }

          New-Item -ItemType Directory -Path $unpack -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $unpack -Force
          $source = Join-Path $unpack 'imgui-1.91.9b'
          if (-not (Test-Path (Join-Path $source 'imgui.cpp'))) {
            throw "Dear ImGui archive did not contain the expected source files."
          }
          Move-Item -LiteralPath $source -Destination 'imgui'
          Write-Host "Dear ImGui $version downloaded successfully."

      - name: Compile Windows application
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++20 /EHsc /utf-8 /W3 /O2 /GL /Gy /Gw /DUNICODE /D_UNICODE /Iimgui /Iimgui\backends main.cpp imgui\imgui.cpp imgui\imgui_draw.cpp imgui\imgui_tables.cpp imgui\imgui_widgets.cpp imgui\backends\imgui_impl_win32.cpp imgui\backends\imgui_impl_dx11.cpp /Fe:dist\SyncPCChecker.exe /link /SUBSYSTEM:WINDOWS /LTCG /OPT:REF /OPT:ICF user32.lib gdi32.lib d3d11.lib dxgi.lib comdlg32.lib wintrust.lib crypt32.lib bcrypt.lib advapi32.lib iphlpapi.lib ws2_32.lib ole32.lib psapi.lib windowscodecs.lib

      - name: Apply administrator manifest
        shell: cmd
        run: mt.exe -nologo -manifest app.manifest -outputresource:dist\SyncPCChecker.exe;#1

      - name: Generate SHA256
        shell: pwsh
        run: Get-FileHash dist/SyncPCChecker.exe -Algorithm SHA256 | Format-List

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Sync-PC-Checker
          path: dist/SyncPCChecker.exe
          if-no-files-found: error
