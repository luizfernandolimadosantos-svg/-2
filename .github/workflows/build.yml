name: Build Macaquito Scanner V38

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Download Dear ImGui
        shell: cmd
        run: |
          git clone --depth 1 --branch v1.91.9b https://github.com/ocornut/imgui.git vendor\imgui
      - name: Compile
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++20 /EHsc /O2 /MT /utf-8 /DUNICODE /D_UNICODE /Ivendor\imgui /Ivendor\imgui\backends main.cpp vendor\imgui\imgui.cpp vendor\imgui\imgui_draw.cpp vendor\imgui\imgui_tables.cpp vendor\imgui\imgui_widgets.cpp vendor\imgui\backends\imgui_impl_win32.cpp vendor\imgui\backends\imgui_impl_dx11.cpp /link d3d11.lib dxgi.lib user32.lib gdi32.lib shell32.lib /SUBSYSTEM:WINDOWS /MANIFEST:EMBED /MANIFESTUAC:"level='asInvoker' uiAccess='false'" /OUT:dist\MacaquitoScanner.exe
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MacaquitoScanner-V38-Windows-x64
          path: dist/MacaquitoScanner.exe
          if-no-files-found: error
