name: Build Macaquito Scanner V47

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Dear ImGui
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.91.9b https://github.com/ocornut/imgui.git imgui

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Windows application
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++20 /EHsc /utf-8 /W3 /O2 /DNOMINMAX /DUNICODE /D_UNICODE /Iimgui /Iimgui\backends main.cpp imgui\imgui.cpp imgui\imgui_draw.cpp imgui\imgui_tables.cpp imgui\imgui_widgets.cpp imgui\backends\imgui_impl_win32.cpp imgui\backends\imgui_impl_dx11.cpp /Fe:dist\MacaquitoScanner.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib d3d11.lib dxgi.lib comdlg32.lib wintrust.lib crypt32.lib bcrypt.lib

      - name: Generate release SHA-256
        shell: pwsh
        run: |
          (Get-FileHash dist\MacaquitoScanner.exe -Algorithm SHA256).Hash | Set-Content dist\MacaquitoScanner.sha256.txt
          Get-Content dist\MacaquitoScanner.sha256.txt

      - name: Upload executable and hash
        uses: actions/upload-artifact@v4
        with:
          name: MacaquitoScanner-V47-Windows
          path: dist/*
